{% extends "rsvp/base.html" %}
{% block content %}
<h1>Do you need accommodation?</h1>
<form method="post">
    {% csrf_token %}
    {{ formset.management_form }}
        {% for form in formset %}
            <div class="card">
                {{ form.id }}
                <h2>{{ form.instance }}</h2>
                <label>
                {{form.needs_accommodation}}
                Yes, I'll need somewhere to stay
                </label>
            </div>
        {% endfor %}
    <input type="submit" value="Continue">
</form>
{% endblock %}
