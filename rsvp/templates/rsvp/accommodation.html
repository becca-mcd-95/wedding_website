<h1>Do you need accommodation?</h1>
<form method="post">
    {% csrf_token %}
    {{ formset.management_form }}
    {% for form in formset %}
        {{ form.id }}
        <h2>{{ form.instance }}</h2>
        <div>{{form.needs_accommodation}}</div>
    {% endfor %}
    <input type="submit" value="Submit">
</form>
