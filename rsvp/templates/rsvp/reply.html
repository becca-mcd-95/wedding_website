<h1>Reply</h1>
{% for person in guest.household.guests.all %}
    <p>{{ person }}</p>
{% endfor %}
<form method="post">
    {% csrf_token %}
    {{ formset.management_form }}
    {% for form in formset %}
        {{ form.id }}
        <p>{{ form.instance }}: {{form.reply_status}}</p>
    {% endfor %}
    <input type="submit" value="Send my reply">
</form>
