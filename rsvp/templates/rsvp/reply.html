{% extends "rsvp/base.html" %}
{% block content %}
<h1>Reply</h1>
<form method="post">
    {% csrf_token %}
    {{ formset.management_form }}
    {% for form in formset %}
        {{ form.id }}
        <p>{{ form.instance }}: {{form.reply_status}}</p>
    {% endfor %}
    <input type="submit" value="Send my reply">
</form>
{% endblock %}
