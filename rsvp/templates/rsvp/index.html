<h1>This is a placeholder</h1>

<form method="post">
    {% csrf_token %}
    {{ form }}
    <input type="submit" value="Find my invite">
</form>
{% if matches is not None %}
    {% if matches %}
        <p>There's more than one guest with that name, please get in touch with us...</p>
    {% else %}
        <p>Sorry we couldn't find you, please get in touch with us...</p>
    {% endif %}
{% endif %}
