{% extends "rsvp/base.html" %}
{% block content %}
<h1>Do you need a coach?</h1>
<form method="post">
    {% csrf_token %}
    {{ formset.management_form }}
    {% for form in formset %}
        <div class="card">
            {{ form.id }}
            <h2>{{ form.instance }}</h2>
            <div>{{form.coach}}</div>
        </div>
    {% endfor %}
    <input type="submit" value="Continue">
</form>
{% endblock %}
