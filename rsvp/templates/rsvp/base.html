{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Karla:wght@400;700&display=swap">
    <link rel="stylesheet" href="{% static 'rsvp/style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>B &amp; R | Our wedding</title>
</head>
<body>
    <header>B &amp; R</header>
    {% if step %}
        <p>Step {{ step }} of {{ total_steps }}</p>
        <div class="progress">
            <div class="progress-fill" style="width: {% widthratio step total_steps 100 %}%"></div>
        </div>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
